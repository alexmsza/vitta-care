name: iOS Build

on:
  push:
    branches: [ "main", "develop-alex" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned Simulator Build)
        run: |
          # Build for iOS Simulator (debug mode, as release is not supported on simulator)
          flutter build ios --debug --simulator
          
          # Create Payload directory structure for IPA
          mkdir Payload
          # Move the built .app into Payload
          # Note: Path might be different for simulator build, usually build/ios/iphonesimulator/Runner.app
          mv build/ios/iphonesimulator/Runner.app Payload
          # Zip it into an IPA (techincally a simulator build, but installable on simulators)
          zip -r Runner.zip Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: Runner.ipa
