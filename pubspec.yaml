name: vitta
description: Vitta Health Platform - Conexao de Confianca
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^13.2.5
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.3.3

  # Data Modeling / Utils
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  uuid: ^4.2.2
  intl: ^0.19.0
  fl_chart: ^1.1.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.5.4
  riverpod_generator: 2.6.4
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpeg"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo.jpeg"
  android_12:
    image: "assets/images/logo.jpeg"
    color: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
